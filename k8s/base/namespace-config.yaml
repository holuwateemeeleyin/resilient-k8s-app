apiVersion: v1
kind: Namespace
metadata:
  name: resilient-app
  labels:
    app.kubernetes.io/part-of: resilient-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilient-app-config
  namespace: resilient-app
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "resilientdb"
